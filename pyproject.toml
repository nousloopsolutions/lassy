[project]
name = "nous-lassy"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "httpx>=0.28,<0.29",
  "cryptography>=45,<48",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0.2,<7",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "pytest-httpx>=0.35,<0.36",
  "ruff>=0.12,<0.13",
]

[project.scripts]
lassy = "lassy.cli:app"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lassy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
target-version = "py312"
line-length = 100
